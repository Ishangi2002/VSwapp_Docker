version: '3.8'

services:
  # ==========================
  #  MySQL Database
  # ==========================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: shashiUOR@55
      MYSQL_DATABASE: Vswappdb
    ports: 
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vswapp-network
    restart: unless-stopped

  # ==========================
  #  Backend (Spring Boot)
  # ==========================
  vswapp-backend:
    image: ishangi1120/vswapp-backend
    #build:
      #context: ./vswapp-backend
      #dockerfile: Dockerfile
    container_name: vswapp-backend
    ports:
      - "8080:8080"       
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/Vswappdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: shashiUOR@55
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
    depends_on:
      - mysql-db
    networks:
      - vswapp-network
    restart: unless-stopped

  # ==========================
  #  Frontend (React/Vite)
  # ==========================
  vswapp-frontend:
    #build:
      #context: ./vswapp-frontend
      #dockerfile: Dockerfile
    image: ishangi1120/vswapp-frontend
    container_name: vswapp-frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PORT=5173
    stdin_open: true
    tty: true
    depends_on:
      - vswapp-backend
    networks:
      - vswapp-network
    restart: unless-stopped

# ==========================
#  Volumes & Networks
# ==========================
volumes:
  mysql_data:

networks:
  vswapp-network:
    driver: bridge
